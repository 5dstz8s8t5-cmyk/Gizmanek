cp.forEach((v,i)=>cpi[(2024+(i/12|0))+'-'+String(i%12+1).padStart(2,'0')]=v);

D0.tx=[];D0.px={};D0.dep=[];document.addEventListener('gesturestart',e=>e.preventDefault());let LOST=false;let S;try{const _r=localStorage.getItem(K);LOST=!_r;S=JSON.parse(_r)||D0}catch(e){S=D0;LOST=true}S.nbp??=3.75;S.nbpH??=[{d:'2026-03-05',r:S.nbp}];S.nbpC??=new Date().toISOString().slice(0,10);S.tk??={};

const f=n=>(n||0).toLocaleString('pl-PL',{minimumFractionDigits:2,maximumFractionDigits:2})+' zł',pc=n=>(n*100).toFixed(1)+'%',cl=n=>n>=0?'up':'dn';
const today=new Date(),iso=d=>d.toISOString().slice(0,10),dt=s=>new Date(s+'T00:00:00Z'),am=(d,m)=>{const x=new Date(d);x.setUTCMonth(x.getUTCMonth()+m);return x},ym=d=>iso(d).slice(0,7);

// ---- obligacje
const BM={EDO:120,ROD:144,ROS:72,TOS:36,COI:48,ROR:12,DOR:24,OTS:3};
function bv(b,D){const t=b.sym.slice(0,3),e=S.em[b.sym],m=BM[t];if(!e||!m)return null;const by=dt(b.d),end=am(by,m);if(D>end)D=end;if(D<by)return{g:0,pd:0,r:e[0]};
const rt=k=>k==1||t=='TOS'?e[0]:Math.max(0,(S.cpi[ym(am(by,12*(k-1)-2))]??S.assume)/100)+e[1];
if(['EDO','ROD','ROS','TOS','COI'].includes(t)){const T=m/12,mb=(D.getUTCFullYear()-by.getUTCFullYear())*12+D.getUTCMonth()-by.getUTCMonth()-(D.getUTCDate()<by.getUTCDate()?1:0),n=Math.min(T,Math.floor(mb/12)+1),s=am(by,12*(n-1)),fr=Math.min(1,Math.max(0,(D-s)/(am(by,12*n)-s)));let V=100,pd=0;
for(let k=1;k<n;k++){const i=Math.round(V*rt(k)*100)/100;if(t=='COI')pd+=i;else V+=i}return{g:V+V*rt(n)*fr,pd,r:rt(n)}}
if(t=='OTS')return{g:100+100*e[0]*(D-by)/864e5/365,pd:0,r:e[0]};
const nb=k=>Math.max(0,nbpAt(am(by,k)))/100+e[1],mc=Math.min(m-1,Math.max(0,(D.getUTCFullYear()-by.getUTCFullYear())*12+D.getUTCMonth()-by.getUTCMonth()-(D.getUTCDate()<by.getUTCDate()?1:0))),dy=(a,b)=>(b-a)/864e5/365;let pd=0;for(let k=0;k<mc;k++)pd+=100*(k?nb(k):e[0])*dy(am(by,k),am(by,k+1));
const r=mc?nb(mc):e[0];return{g:100+100*r*dy(am(by,mc),D),pd,r}}
function nbpAt(d){let x=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),1)),n=0;while(n<10){x=new Date(x-864e5);const w=x.getUTCDay();if(w&&w<6)n++}const L=S.nbpH.slice().sort((a,b)=>a.d<b.d?-1:1);let r=L[0].r;L.forEach(e=>{if(e.d<=iso(x))r=e.r});return Math.max(0,r)}
const curNbp=()=>S.nbpH.slice().sort((a,b)=>a.d<b.d?-1:1).pop().r;
function remind(){return remind2()}
function remind2(){const need=S.bonds.some(b=>!b.cl&&/^(ROR|DOR)/.test(b.sym));return need&&(today-dt(S.nbpC))/864e5>30?`<div class="card" style="border:2px solid var(--bad)"><b>🔔 Sprawdź stopę NBP</b><div class="note">Ostatnie potwierdzenie: ${S.nbpC} (${curNbp()}%). RPP decyduje co miesiąc — jeśli stopa się zmieniła, dodaj zmianę; jeśli nie, potwierdź.</div><button class="btn s" onclick="addNbp()">Zmieniła się — dodaj</button><button class="btn s" onclick="S.nbpC=iso(today);save();draw()">Bez zmian — potwierdź</button></div>`:''}
const bn=(b,D)=>{const v=bv(b,D);if(!v)return null;const x=(v.g-100)*(TAX[b.acc]??.19);return{...v,n:v.g-x}};
// ---- aktywa
const names=()=>[...new Set(S.tx.map(t=>t.a))];
function pos(a,D,acc){let q=0,bq=0,bc=0,real=0;S.tx.filter(t=>t.a==a&&ow(t.o)&&(!acc||acc=='Wszystkie'||t.acc==acc)&&(!D||dt(t.d)<=D)).sort((x,y)=>x.d<y.d?-1:1).forEach(t=>{if(t.q>0){bq+=t.q;bc+=t.q*t.p}else real+=-t.q*(t.p-bc/bq);q+=t.q});const av=bq?bc/bq:0;return{q,av,cost:q*av,real}}
function lastPx(a,D){const t=S.tx.filter(t=>t.a==a&&dt(t.d)<=D).sort((x,y)=>x.d<y.d?-1:1).pop();return t?t.p:0}
// ---- lokaty
function dfc(d){const mm=d.m||0,s=dt(d.d),g=mm?d.c*d.r*(am(s,mm)-s)/864e5/365:d.c*d.r,n=g*(1-.19),mp={},cnt=mm||12;
if(d.pay=='Miesięcznie'||!mm)for(let i=1;i<=(mm||36);i++)mp[ym(am(s,i))]=n/cnt;else mp[ym(am(s,mm))]=n;return{g,n,mp,end:mm?am(s,mm):null}}
const mkeys=(n,o=0)=>Array.from({length:n},(_,i)=>ym(am(new Date(Date.UTC(today.getUTCFullYear(),today.getUTCMonth(),1)),i+o)));
// ---- obliczenia ogólne
function calc(){const r={st:[],bv:0,bc:0,dep:0,int:0,real:0,fc:0,fm:0,lm:0};names().forEach(a=>{const p=pos(a,0),v=p.q*(S.px[a]||0);r.st.push({a,...p,px:S.px[a]||0,v});r.real+=p.real});
S.bonds.filter(b=>ow(b.o)).forEach(b=>{if(b.cl)return;const x=bn(b,today);if(x){r.bv+=b.q*x.g;r.bc+=b.q*(b.p||100)}});
S.dep.filter(d=>ow(d.o)).forEach(d=>{if(d.st=='Aktywna'||d.st=='Zakończona'){r.dep+=d.c;r.int+=(d.rg||0)*.81}});
const k=mkeys(12);S.dep.filter(d=>ow(d.o)&&d.st=='Aktywna').forEach(d=>{const m=dfc(d).mp;k.forEach(x=>r.fc+=m[x]||0);r.fm+=m[ym(today)]||0});r.lm=S.log.filter(l=>ow(l.o)&&l.d.slice(0,7)==ym(am(today,-1))).reduce((a,l)=>a+l.v,0);return r}
// ---- UI
let tab=0,ch=null,H={acc:'Wszystkie',z:'Wszystko',a:''};
const TABS=[['🏠','Start'],['📈','Aktywa'],['🏛️','Obligacje'],['🏦','Lokaty'],['🕒','Historia'],['⚙️','Więcej']];

function vAkt(){const r=calc();return`<button class="btn" onclick="addTx()">+ Dodaj transakcję</button><button class="btn s" onclick="refresh()">↻ Odśwież kursy z giełdy</button><h2>Pozycje</h2><div class="card">${r.st.map(x=>`<div class="row"><div>${x.a}<small>${x.q} szt. · śr. ${f(x.av)}</small></div><div class="r">${f(x.v)}<small class="${cl(x.v-x.cost)}">${f(x.v-x.cost)} (${pc(x.cost?(x.v-x.cost)/x.cost:0)})</small></div></div>`).join('')}</div>
